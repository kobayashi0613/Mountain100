<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>日本百名山</title>
<meta name="description" content="日本百名山の一覧と登頂記録">
<meta name="theme-color" content="#16324a">

<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="百名山">

<link rel="stylesheet" href="./styles.css">
</head>
<body>

<header class="hero">
  <h1>日本百名山</h1>
  <div class="progress">
    <div class="progress-line">
      <span class="progress-label">登頂記録</span>
      <span class="progress-count"><strong id="visitedCount">0</strong> / <span id="totalCount">100</span> 座</span>
    </div>
    <div class="bar"><div class="bar-fill" id="barFill"></div></div>
  </div>
</header>

<div class="toolbar">
  <input type="search" id="search" placeholder="山名・読み・都道府県で検索" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="検索">
  <div class="segmented" role="tablist" aria-label="表示の絞り込み">
    <button role="tab" data-filter="all" class="on" aria-selected="true">すべて</button>
    <button role="tab" data-filter="visited" aria-selected="false">登頂済み</button>
    <button role="tab" data-filter="unvisited" aria-selected="false">未登頂</button>
  </div>
</div>

<main>
  <ul id="list" class="list"></ul>
  <p id="empty" class="empty" hidden>該当する山がありません</p>
  <p id="count" class="count"></p>

  <section class="backup">
    <h2>記録のバックアップ</h2>
    <p>登頂記録はこの端末の中だけに保存されます。機種変更やSafariのデータ削除に備えて、ときどき書き出しておくと安心です。</p>
    <div class="backup-buttons">
      <button id="export" class="btn">記録を書き出す</button>
      <button id="importBtn" class="btn">記録を読み込む</button>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
    </div>
  </section>

  <footer class="foot">深田久弥『日本百名山』（1964年）に選定された100山</footer>
</main>

<dialog id="detail" class="sheet">
  <div class="sheet-head">
    <h2 id="dName"></h2>
    <button id="dClose" class="close" aria-label="閉じる">✕</button>
  </div>
  <button id="dToggle" class="visit-toggle">
    <span class="box" aria-hidden="true"></span>
    <span class="visit-text">登頂済みにする</span>
  </button>
  <dl id="dInfo" class="info"></dl>
</dialog>

<script src="./app.js"></script>
</body>
</html>
