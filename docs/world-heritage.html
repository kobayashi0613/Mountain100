<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>日本の世界遺産</title>
<meta name="description" content="日本の世界遺産の一覧と訪問記録">
<meta name="theme-color" content="#16324a">

<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="百名山">

<link rel="stylesheet" href="./styles.css">
</head>
<body>

<nav class="site-nav" aria-label="ページの切り替え">
  <a href="./index.html">日本百名山</a>
  <a href="./world-heritage.html" class="on" aria-current="page">世界遺産</a>
  <a href="./monuments-animals.html">特別天然記念物</a>
</nav>

<header class="hero">
  <h1>日本の世界遺産</h1>
  <div class="cats" role="tablist" aria-label="区分">
    <button role="tab" data-category="all" class="on" aria-selected="true">すべて</button>
    <button role="tab" data-category="文化遺産" aria-selected="false">文化遺産</button>
    <button role="tab" data-category="自然遺産" aria-selected="false">自然遺産</button>
  </div>
  <div class="progress">
    <div class="progress-line">
      <span class="progress-label">訪問記録</span>
      <span class="progress-count"><strong id="visitedCount">0</strong> / <span id="totalCount">0</span> 件</span>
    </div>
    <div class="bar"><div class="bar-fill" id="barFill"></div></div>
  </div>
</header>

<div class="toolbar">
  <input type="search" id="search" placeholder="名称・読み・都道府県・登録年で検索" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="検索">
  <div class="segmented" role="tablist" aria-label="表示の絞り込み">
    <button role="tab" data-filter="all" class="on" aria-selected="true">すべて</button>
    <button role="tab" data-filter="visited" aria-selected="false">訪問済み</button>
    <button role="tab" data-filter="unvisited" aria-selected="false">未訪問</button>
  </div>
</div>

<main>
  <ul id="list" class="list"></ul>
  <p id="empty" class="empty" hidden>該当する物件がありません</p>
  <p id="count" class="count"></p>

  <footer class="foot">UNESCO世界遺産条約に基づき登録された日本国内の物件。記録のバックアップはトップページ（日本百名山）からまとめて書き出せます。</footer>
</main>

<dialog id="detail" class="sheet">
  <div class="sheet-head">
    <h2 id="dName"></h2>
    <button id="dClose" class="close" aria-label="閉じる">✕</button>
  </div>
  <button id="dToggle" class="visit-toggle">
    <span class="box" aria-hidden="true"></span>
    <span class="visit-text">訪問済みにする</span>
  </button>
  <dl id="dInfo" class="info"></dl>
  <p id="dNote" class="note" hidden></p>
</dialog>

<script src="./world-heritage.js"></script>
</body>
</html>
